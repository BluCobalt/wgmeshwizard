"cli.export_accepts_one_project": "export accepts exactly one project path"
"cli.export_help": "WireGuard Mesh Wizard — export\n\nUsage: wgmeshwizard export PROJECT [-o OUTPUT_DIRECTORY]\n\nPROJECT: folder, .zip or .wgm archive.\nOUTPUT_DIRECTORY: destination for the wg-quick .conf files.\n\nMissing private keys and mesh-wide preshared keys are generated and saved\nback to the project before configurations are written."
"cli.export_needs_project": "export needs a project path (a folder, .zip or .wgm file)"
"cli.exported_1": "Exported 1 WireGuard configuration to %{path}"
"cli.exported_many": "Exported %{count} WireGuard configurations to %{path}"
"cli.help": "WireGuard Mesh Wizard\n\nUsage:\n  wgmeshwizard [PROJECT]\n  wgmeshwizard export PROJECT [-o OUTPUT_DIRECTORY]\n\nPROJECT may be a directory containing mesh.csv, hosts.csv and links.csv,\nor a .zip/.wgm archive containing the same three files. It is created on\nfirst save. When PROJECT is omitted, the GUI prompts you to open an\nexisting project or create a new one.\n\nThe export command writes one wg-quick .conf per host and exits without\nopening the GUI. Without -o it writes next to the project (or to\n<project>/output for directory projects)."
